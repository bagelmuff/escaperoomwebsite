<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dr. Frankl Sign-In</title>
<style>
  :root {
    --bg-deep: #0d1f24;
    --fg: #f3f7f6;
    --fg-dim: rgba(243, 247, 246, 0.72);
    --field: rgba(0, 0, 0, 0.35);
    --field-border: rgba(255, 255, 255, 0.5);
    --error: #ff7a7a;
    --font: "Segoe UI Variable Text", "Segoe UI Variable", "Segoe UI", Arial, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg-deep);
    color: var(--fg);
    font-family: var(--font);
    overflow: hidden;
  }
  [hidden] { display: none !important; }
  .screen {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding-inline: 16px;
    background:
      linear-gradient(rgba(0, 0, 0, 0.28), rgba(0, 0, 0, 0.28)),
      url("bg-hd.png") center / cover no-repeat,
      var(--bg-deep);
  }
  .clock {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 28px);
    left: 32px;
    display: grid;
    gap: 2px;
  }
  .clock .time { font-size: 3.4rem; font-weight: 300; line-height: 1; font-variant-numeric: tabular-nums; }
  .clock .date { font-size: 1.05rem; color: var(--fg-dim); }

  .signin {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    width: 100%;
    max-width: 320px;
  }
  .avatar {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    background: #c9cfd2;
    overflow: hidden;
  }
  .avatar svg { display: block; width: 100%; height: 100%; }
  .name { font-size: 1.9rem; font-weight: 400; margin: 0; }

  form { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
  .field {
    display: flex;
    width: 100%;
    background: var(--field);
    border: 1px solid var(--field-border);
    border-radius: 0;
    transition: border-color 0.15s;
  }
  .field:focus-within { border-color: var(--fg); }
  input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: 0;
    outline: none;
    color: var(--fg);
    font: inherit;
    font-size: 1rem;
    padding: 11px 14px;
  }
  input::placeholder { color: var(--fg-dim); }
  .field button {
    background: transparent;
    border: 0;
    border-left: 1px solid var(--field-border);
    color: var(--fg);
    width: 46px;
    cursor: pointer;
    display: grid;
    place-items: center;
    border-radius: 0;
  }
  .field button:hover { background: rgba(255, 255, 255, 0.12); }
  .field button:focus-visible { outline: 2px solid var(--fg); outline-offset: -2px; }
  .error { color: var(--error); font-size: 0.95rem; font-weight: 500; min-height: 1.3em; margin: 0; }

  /* ---------- Desktop ---------- */
  .desktop {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: #050505;
    user-select: none;
    -webkit-user-select: none;
  }
  .desktop canvas.bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .icons {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 10px);
    left: 10px;
    bottom: 58px;
    display: flex;
    flex-direction: column;
    flex-wrap: wrap;
    align-content: flex-start;
    gap: 6px;
  }
  .icon {
    width: 84px;
    padding: 6px 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    background: transparent;
    border: 1px solid transparent;
    color: #ffffff;
    font: inherit;
    font-size: 0.85rem;
    cursor: default;
  }
  .icon svg { width: 56px; height: 48px; }
  .icon:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.2); }
  .icon.selected { background: rgba(255, 255, 255, 0.24); border-color: rgba(255, 255, 255, 0.4); }
  .icon:focus-visible { outline: 1px dotted #ffffff; outline-offset: -3px; }

  .window {
    position: absolute;
    width: min(560px, calc(100vw - 32px));
    height: min(380px, calc(100vh - 120px));
    background: #ffffff;
    border: 1px solid #7a8ca8;
    display: flex;
    flex-direction: column;
    color: #1a1a1a;
  }
  .window.active { border-color: #a4161a; }
  .titlebar {
    display: flex;
    align-items: center;
    height: 34px;
    background: #f3f3f3;
    border-bottom: 1px solid #e0e0e0;
    cursor: move;
    touch-action: none;
  }
  .window.active .titlebar { background: #ffffff; }
  .titlebar .title { flex: 1; padding-inline: 12px; font-size: 0.85rem; }
  .titlebar .close {
    width: 46px;
    height: 100%;
    border: 0;
    background: transparent;
    font: inherit;
    font-size: 1rem;
    cursor: pointer;
    color: #1a1a1a;
  }
  .titlebar .close:hover { background: #e81123; color: #ffffff; }
  .window .body { flex: 1; background: #ffffff; }

  .taskbar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 48px;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: #0d0d0d;
    border-top: 1px solid #3a0a0d;
    z-index: 100000;
    display: flex;
    align-items: center;
    gap: 4px;
    padding-inline: 8px;
    color: #ffffff;
  }
  .taskbar button {
    height: 38px;
    border: 0;
    background: transparent;
    color: #ffffff;
    font: inherit;
    font-size: 0.85rem;
    padding-inline: 12px;
    cursor: pointer;
  }
  .taskbar button:hover { background: rgba(255, 255, 255, 0.1); }
  .taskbar button.on { background: rgba(255, 255, 255, 0.16); border-bottom: 2px solid #c1121f; }
  .taskbar .tasks { display: flex; gap: 4px; flex: 1; min-width: 0; overflow: hidden; }
  .taskbar .tray { text-align: right; font-size: 0.78rem; line-height: 1.3; padding-inline: 8px; font-variant-numeric: tabular-nums; }

  @media (max-width: 480px) {
    .clock { left: 20px; }
    .clock .time { font-size: 2.6rem; }
    .avatar { width: 120px; height: 120px; }
  }
</style>
</head>
<body>

<div class="screen" id="lock">
  <div class="clock" aria-hidden="true">
    <div class="time" id="time">--:--</div>
    <div class="date" id="date"></div>
  </div>

  <div class="signin">
    <div class="avatar" aria-hidden="true">
      <svg viewBox="0 0 100 100">
        <rect width="100" height="100" fill="#c9cfd2"/>
        <circle cx="50" cy="38" r="18" fill="#f4f6f7"/>
        <ellipse cx="50" cy="92" rx="34" ry="28" fill="#f4f6f7"/>
      </svg>
    </div>
    <h1 class="name">Dr. Victor Frankl</h1>

    <form id="login" autocomplete="off">
      <div class="field" id="field">
        <input id="password" type="text" name="pin-entry" placeholder="Password" aria-label="Password" inputmode="numeric" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore data-bwignore data-form-type="other" autofocus>
        <button type="submit" aria-label="Sign in">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
      <p class="error" id="error" role="alert"></p>
    </form>
  </div>
</div>

<div class="desktop" id="home" hidden>
  <canvas class="bg" id="bg" aria-hidden="true"></canvas>
  <div class="icons" id="icons"></div>
  <div id="windows"></div>
  <div class="taskbar">
    <button type="button" id="signout">Sign out</button>
    <div class="tasks" id="tasks"></div>
    <div class="tray"><div id="tb-time"></div><div id="tb-date"></div></div>
  </div>
</div>

<template id="file-icon">
  <svg viewBox="0 0 56 48" aria-hidden="true">
    <path d="M2 8a3 3 0 0 1 3-3h15l5 5h26a3 3 0 0 1 3 3v29a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3z" fill="#e0a526"/>
    <rect x="6" y="13" width="44" height="6" fill="#ffffff"/>
    <path d="M2 18a3 3 0 0 1 3-3h46a3 3 0 0 1 3 3v24a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3z" fill="#ffc83d"/>
  </svg>
</template>

<script>
  const PASSWORD = "86239";
  const form = document.getElementById("login");
  const input = document.getElementById("password");
  const error = document.getElementById("error");

  // Plain text box so browsers never offer a saved password; it only ever shows dots.
  let typed = "";
  const DOT = "\u2022";
  const show = () => {
    input.value = DOT.repeat(typed.length);
    input.setSelectionRange(input.value.length, input.value.length);
  };
  const clearEntry = () => { typed = ""; show(); };

  input.addEventListener("beforeinput", (e) => {
    const t = e.inputType;
    if (t === "insertText" || t === "insertReplacementText") {
      e.preventDefault();
      typed += e.data || "";
    } else if (t.startsWith("delete")) {
      e.preventDefault();
      typed = t === "deleteContentBackward" ? typed.slice(0, -1) : "";
    } else if (t !== "insertLineBreak") {
      e.preventDefault();
    }
    show();
    error.textContent = "";
  });
  input.addEventListener("input", () => {
    if (input.value !== DOT.repeat(typed.length)) clearEntry();
  });
  input.addEventListener("paste", (e) => e.preventDefault());
  input.addEventListener("drop", (e) => e.preventDefault());
  input.addEventListener("click", show);

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    if (typed === PASSWORD) {
      clearEntry();
      document.getElementById("lock").hidden = true;
      document.getElementById("home").hidden = false;
      drawWallpaper();
    } else {
      error.textContent = "Wrong. Try again.";
      clearEntry();
      input.focus();
    }
  });

  // ---------- Wallpaper: black lace with red splatters ----------
  const bg = document.getElementById("bg");
  function rng(seed) {
    return () => {
      seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function drawRosette(ctx, x, y, r) {
    ctx.save();
    ctx.translate(x, y);
    ctx.strokeStyle = "rgba(120,120,120,0.55)";
    ctx.lineWidth = 1.4;
    for (let i = 0; i < 8; i++) {
      ctx.save();
      ctx.rotate((i / 8) * Math.PI * 2);
      ctx.beginPath();
      ctx.ellipse(0, -r * 0.55, r * 0.22, r * 0.45, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(0, -r * 0.55, r * 0.09, r * 0.22, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
    ctx.beginPath(); ctx.arc(0, 0, r * 0.18, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, r * 1.08, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "rgba(120,120,120,0.5)";
    for (let i = 0; i < 24; i++) {
      const a = (i / 24) * Math.PI * 2;
      ctx.beginPath();
      ctx.arc(Math.cos(a) * r * 1.22, Math.sin(a) * r * 1.22, 1.6, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function lacePanel(ctx, h, x0, pw, dir) {
    const inner = x0 + dir * pw;
    const r = 20;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(x0, 0);
    ctx.lineTo(inner, 0);
    for (let y = 0; y < h; y += r * 2) {
      ctx.arc(inner, y + r, r, -Math.PI / 2, Math.PI / 2, dir < 0);
    }
    ctx.lineTo(x0, h);
    ctx.closePath();
    ctx.fillStyle = "#0b0b0b";
    ctx.fill();
    ctx.clip();

    ctx.strokeStyle = "rgba(80,80,80,0.4)";
    ctx.lineWidth = 1;
    const s = 16;
    const left = Math.min(x0, inner + dir * r) - h, right = Math.max(x0, inner + dir * r) + h;
    ctx.beginPath();
    for (let k = left; k < right; k += s) {
      ctx.moveTo(k, 0); ctx.lineTo(k + h * 0.58, h);
      ctx.moveTo(k, 0); ctx.lineTo(k - h * 0.58, h);
    }
    ctx.stroke();

    const gap = 130;
    const cols = [x0 + dir * pw * 0.3, x0 + dir * pw * 0.75];
    cols.forEach((cx, ci) => {
      for (let y = ci ? gap / 2 : 20; y < h + gap; y += gap) {
        ctx.fillStyle = "#101010";
        ctx.beginPath(); ctx.arc(cx, y, 42, 0, Math.PI * 2); ctx.fill();
        drawRosette(ctx, cx, y, 34);
      }
    });
    ctx.restore();

    ctx.strokeStyle = "rgba(140,140,140,0.6)";
    ctx.lineWidth = 1.3;
    for (let y = 0; y < h; y += r * 2) {
      ctx.beginPath();
      ctx.arc(inner, y + r, r, -Math.PI / 2, Math.PI / 2, dir < 0);
      ctx.stroke();
      ctx.fillStyle = "#050505";
      ctx.beginPath();
      ctx.arc(inner + dir * 8, y + r, 4.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.moveTo(inner - dir * 6, 0);
    ctx.lineTo(inner - dir * 6, h);
    ctx.stroke();
  }

  function drawLace(ctx, w, h) {
    ctx.fillStyle = "#050505";
    ctx.fillRect(0, 0, w, h);
    const pw = Math.max(70, Math.min(260, w * 0.2));
    lacePanel(ctx, h, 0, pw, 1);
    lacePanel(ctx, h, w, pw, -1);
  }

  function blobPath(ctx, r, cx, cy, size, n, jit) {
    const pts = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      const rad = size * (1 - jit / 2 + r() * jit);
      pts.push([cx + Math.cos(a) * rad, cy + Math.sin(a) * rad]);
    }
    ctx.beginPath();
    const mid = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
    let m = mid(pts[n - 1], pts[0]);
    ctx.moveTo(m[0], m[1]);
    for (let i = 0; i < n; i++) {
      const p = pts[i], q = pts[(i + 1) % n];
      m = mid(p, q);
      ctx.quadraticCurveTo(p[0], p[1], m[0], m[1]);
    }
    ctx.closePath();
  }

  function drawSplat(ctx, r, cx, cy, size) {
    const palettes = [
      ["#5c0711", "#8c0f1d", "#b3192b"],
      ["#4a050d", "#7d0c18", "#a51426"],
      ["#650a14", "#9a1222", "#c21f33"],
    ];
    const mid = palettes[Math.floor(r() * palettes.length)][1];

    const streaks = 6 + Math.floor(r() * 7);
    ctx.fillStyle = mid;
    for (let i = 0; i < streaks; i++) {
      const a = r() * Math.PI * 2;
      const len = size * (1.3 + r() * 1.5);
      const base = size * (0.12 + r() * 0.14);
      const ex = cx + Math.cos(a) * len, ey = cy + Math.sin(a) * len;
      const nx = -Math.sin(a), ny = Math.cos(a);
      const bend = (r() - 0.5) * size * 0.25;
      const mx = (cx + ex) / 2 + nx * bend, my = (cy + ey) / 2 + ny * bend;
      ctx.beginPath();
      ctx.moveTo(cx + nx * base, cy + ny * base);
      ctx.quadraticCurveTo(mx + nx * base * 0.3, my + ny * base * 0.3, ex, ey);
      ctx.quadraticCurveTo(mx - nx * base * 0.3, my - ny * base * 0.3, cx - nx * base, cy - ny * base);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(ex, ey, base * (0.45 + r() * 0.4), 0, Math.PI * 2);
      ctx.fill();
      for (let k = 1; k <= 2; k++) {
        if (r() < 0.6) {
          const d = len + size * (0.25 + r() * 0.5) * k;
          ctx.beginPath();
          ctx.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d, base * (0.35 / k), 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    blobPath(ctx, r, cx, cy, size, 16, 0.45); ctx.fill();

    const mist = 30 + Math.floor(r() * 30);
    for (let i = 0; i < mist; i++) {
      const a = r() * Math.PI * 2;
      const d = size * (1.1 + Math.pow(r(), 1.6) * 2.6);
      ctx.globalAlpha = 0.5 + r() * 0.5;
      ctx.beginPath();
      ctx.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d, 0.6 + r() * size * 0.05, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    const drips = Math.floor(r() * 3);
    for (let i = 0; i < drips; i++) {
      const dx = cx + (r() - 0.5) * size;
      const top = cy + size * 0.5;
      const dw = 2 + r() * size * 0.1;
      const dl = size * (1.2 + r() * 2.2);
      ctx.beginPath();
      ctx.moveTo(dx - dw, top);
      ctx.quadraticCurveTo(dx - dw * 0.4, top + dl * 0.6, dx - dw * 0.35, top + dl);
      ctx.lineTo(dx + dw * 0.35, top + dl);
      ctx.quadraticCurveTo(dx + dw * 0.4, top + dl * 0.6, dx + dw, top);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(dx, top + dl + dw * 0.5, dw * 0.75, dw * 0.95, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawWallpaper() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = bg.clientWidth, h = bg.clientHeight;
    if (!w || !h) return;
    bg.width = w * dpr;
    bg.height = h * dpr;
    const ctx = bg.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawLace(ctx, w, h);

    const layer = document.createElement("canvas");
    layer.width = bg.width;
    layer.height = bg.height;
    const lc = layer.getContext("2d");
    lc.setTransform(dpr, 0, 0, dpr, 0, 0);
    const r = rng(86239);
    const count = Math.max(5, Math.round((w * h) / 140000));
    for (let i = 0; i < count; i++) {
      drawSplat(lc, r, r() * w, r() * (h - 60), 14 + r() * 34);
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 0.6;
    ctx.drawImage(layer, 0, 0);
    ctx.globalAlpha = 1;
  }
  let resizeTimer;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (!document.getElementById("home").hidden) drawWallpaper(); }, 150);
  });

  // ---------- Desktop ----------
  const FILES = ["1", "2", "3", "4"];
  const iconsEl = document.getElementById("icons");
  const winsEl = document.getElementById("windows");
  const tasksEl = document.getElementById("tasks");
  const iconTpl = document.getElementById("file-icon");
  const open = new Map();
  let zTop = 10;
  let offset = 0;

  FILES.forEach((name) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "icon";
    b.id = "icon-" + name;
    b.appendChild(iconTpl.content.cloneNode(true));
    const label = document.createElement("span");
    label.textContent = name;
    b.appendChild(label);
    b.addEventListener("click", (e) => {
      document.querySelectorAll(".icon.selected").forEach((i) => i.classList.remove("selected"));
      b.classList.add("selected");
      if (e.pointerType === "touch") openFile(name);
    });
    b.addEventListener("dblclick", () => openFile(name));
    b.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); openFile(name); } });
    iconsEl.appendChild(b);
  });

  document.getElementById("home").addEventListener("pointerdown", (e) => {
    if (e.target === e.currentTarget || e.target === bg) {
      document.querySelectorAll(".icon.selected").forEach((i) => i.classList.remove("selected"));
    }
  });

  function focusWin(name) {
    open.forEach((o, n) => {
      o.win.classList.toggle("active", n === name);
      o.task.classList.toggle("on", n === name);
    });
    const o = open.get(name);
    if (o) o.win.style.zIndex = ++zTop;
  }

  function openFile(name) {
    if (open.has(name)) { focusWin(name); return; }
    const win = document.createElement("div");
    win.className = "window";
    const w = Math.min(560, window.innerWidth - 32);
    const h = Math.min(380, window.innerHeight - 120);
    win.style.left = Math.max(16, (window.innerWidth - w) / 2 + offset) + "px";
    win.style.top = Math.max(16, (window.innerHeight - 48 - h) / 2 + offset) + "px";
    offset = (offset + 28) % 112;

    const bar = document.createElement("div");
    bar.className = "titlebar";
    const title = document.createElement("span");
    title.className = "title";
    title.textContent = name;
    const close = document.createElement("button");
    close.type = "button";
    close.className = "close";
    close.setAttribute("aria-label", "Close " + name);
    close.textContent = "\u2715";
    bar.append(title, close);
    const body = document.createElement("div");
    body.className = "body";
    win.append(bar, body);
    winsEl.appendChild(win);

    const task = document.createElement("button");
    task.type = "button";
    task.textContent = name;
    task.addEventListener("click", () => focusWin(name));
    tasksEl.appendChild(task);

    open.set(name, { win, task });
    win.addEventListener("pointerdown", () => focusWin(name));
    close.addEventListener("click", (e) => { e.stopPropagation(); closeFile(name); });

    bar.addEventListener("pointerdown", (e) => {
      if (e.target === close) return;
      const sx = e.clientX, sy = e.clientY;
      const ox = win.offsetLeft, oy = win.offsetTop;
      bar.setPointerCapture(e.pointerId);
      const move = (ev) => {
        const nx = Math.min(Math.max(ox + ev.clientX - sx, -w + 80), window.innerWidth - 80);
        const ny = Math.min(Math.max(oy + ev.clientY - sy, 0), window.innerHeight - 82);
        win.style.left = nx + "px";
        win.style.top = ny + "px";
      };
      const up = () => {
